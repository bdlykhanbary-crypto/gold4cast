name: Gold4Cast Forecast

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forecast:
    name: Run Gold4Cast forecast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOLD4CAST_DATA: market_data.csv
      GOLD4CAST_LIVE_SNAPSHOT: live_snapshot.csv
      GOLD4CAST_REQUIRE_LIVE: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install forecasting stack
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt

      - name: Obtain user-authorized market data
        env:
          GOLD4CAST_DATA_URL: ${{ secrets.GOLD4CAST_DATA_URL }}
        run: |
          if [ -z "$GOLD4CAST_DATA_URL" ]; then
            echo "Set repository secret GOLD4CAST_DATA_URL to a lawful normalized CSV source."
            echo "Required columns: date,gold18_toman,usd_irr,xau_usd"
            exit 1
          fi
          curl --fail --location --silent --show-error             "$GOLD4CAST_DATA_URL"             --output "$GOLD4CAST_DATA"

      - name: Obtain user-authorized live snapshot
        env:
          GOLD4CAST_LIVE_SNAPSHOT_URL: ${{ secrets.GOLD4CAST_LIVE_SNAPSHOT_URL }}
        run: |
          if [ -z "$GOLD4CAST_LIVE_SNAPSHOT_URL" ]; then
            echo "Set repository secret GOLD4CAST_LIVE_SNAPSHOT_URL to a lawful normalized live-snapshot CSV."
            echo "Required columns: date,gold18_toman,usd_irr,xau_usd"
            echo "Optional columns: gold_quote_time,usd_quote_time,xau_quote_time"
            exit 1
          fi
          curl --fail --location --silent --show-error             "$GOLD4CAST_LIVE_SNAPSHOT_URL"             --output "$GOLD4CAST_LIVE_SNAPSHOT"

      - name: Forecast
        env:
          OMP_NUM_THREADS: '4'
        run: python forecast_xgboost_live.py

      - name: Update scorecard in this run
        run: python scorecard_update.py

      - name: Upload forecast
        uses: actions/upload-artifact@v4
        with:
          name: gold4cast-forecast
          path: |
            latest_xgboost_forecast.csv
            gold18_forecast_report.html
            forecast_history.csv
            forecast_evaluations.csv
